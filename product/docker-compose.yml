services:
  zhipi:
    build: .
    image: zhipi-product:1.0.0
    restart: unless-stopped
    init: true
    ports:
      - "${ZHIPI_BIND:-127.0.0.1}:${ZHIPI_PUBLIC_PORT:-8010}:8010"
    env_file:
      - .env
    environment:
      ZHIPI_DOCKER: "1"
      ZHIPI_ENV: production
      ZHIPI_DATA_DIR: /data
    volumes:
      - zhipi-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/readyz', timeout=3)"]
      interval: 30s
      timeout: 4s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  zhipi-data:

